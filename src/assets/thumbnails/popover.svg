<svg xmlns="http://www.w3.org/2000/svg" width="200" height="120" viewBox="0 0 200 120">
  <defs>
    <filter id="psh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="200" height="120" fill="#f8f9fb"/>
  <!-- floating bubble -->
  <g filter="url(#psh)">
    <rect x="52" y="16" width="100" height="54" rx="5" fill="#fff" stroke="#f0f0f0"/>
  </g>
  <!-- arrow pointing to trigger -->
  <rect x="99.5" y="65" width="10" height="10" transform="rotate(45 104.5 70)" fill="#fff" stroke="#f0f0f0"/>
  <rect x="94" y="58" width="22" height="9" fill="#fff"/>
  <!-- bubble content -->
  <rect x="64" y="27" width="36" height="6" rx="3" fill="#8c8c8c"/>
  <rect x="64" y="42" width="74" height="4.5" rx="2" fill="#d9d9d9"/>
  <rect x="64" y="52" width="58" height="4.5" rx="2" fill="#d9d9d9"/>
  <!-- trigger in hover state -->
  <rect x="74" y="82" width="62" height="24" rx="4" fill="#fff" stroke="#1890ff"/>
  <text x="105" y="97" font-family="Arial,sans-serif" font-size="8.5" fill="#1890ff" text-anchor="middle">Hover me</text>
  <!-- mouse cursor -->
  <path d="M110 88 l0 13.5 l3.6 -3.2 l2.5 5.2 l3 -1.4 l-2.5 -5.2 l4.9 -0.5 z" fill="#1f1f1f" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
